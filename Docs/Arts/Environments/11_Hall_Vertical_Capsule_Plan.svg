="1312" y="732" text-anchor="middle" font-size="14">경매장 2F +4.00</text><text x="1010" y="790" text-anchor="middle" font-size="16">거래소 1F</text><text x="1328" y="790" text-anchor="middle" font-size="13">중층 아래 공간</text><line x1="1178" y1="713" x2="1224" y2="713" stroke="#111" /><line x1="1178" y1="708" x2="1178" y2="734" stroke="#111" /><line x1="1224" y1="708" x2="1224" y2="734" stroke="#111" /><text x="1168" y="692" text-anchor="middle" font-size="12">중앙 돌출 약 2.8</text><text x="1155" y="494" text-anchor="middle" font-size="17">돔 최고점 +16.00 (유지)</text><text x="947" y="643" text-anchor="middle" font-size="12">벽 상단 +9.00</text><text x="1155" y="874" text-anchor="middle" font-size="12">중층 중앙을 지나는 단면 / 측면 출입문은 절단선 밖</text><path d="M50 982H1450" stroke="#111"/><text x="60" y="1018" font-size="18" font-weight="bold">수정 사항</text><text x="60" y="1050" font-size="15">① 가로는 28m로 복원하고 세로를 35m로 늘림. 천장 최고점 16m 유지.</text><text x="60" y="1080" font-size="15">② 기존 하단 출입문 삭제 → 거래소 오른쪽 벽에 출입문 배치.</text><text x="60" y="1110" font-size="15">③ 중층 앞 가장자리는 중앙만 둥글게 돌출. 양쪽 계단은 안쪽에서 바깥쪽으로 상승.</text><text x="60" y="1146" font-size="12">평면은 1·2층 중첩 배치도이며, 회색은 중층 바닥임. 돌출부는 계단이나 1층 통로가 아님.</text><text x="1430" y="1145" text-anchor="end" font-size="25">A–04</text></g></svg>
